name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ./opencode-github-switcher
        run: npm install

      - name: Build and Upload Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./opencode-github-switcher
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 0.1.9 What's New
            
            ### 🐛 Bug Fixes
            - Fixed an issue where the first login via the tool wouldn't be recognized by OpenCode if no prior login data existed in the system. The tool now ensures the auth data is correctly written to all potential OpenCode configuration directories.
            
            ### 📝 Documentation
            - Added important notice: Seamless hot-switching requires OpenCode to be running in a **PowerShell** environment. If run in CMD, OpenCode needs to be manually restarted after switching accounts.
          releaseDraft: false
          prerelease: false
