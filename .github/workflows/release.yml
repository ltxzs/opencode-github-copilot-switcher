name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ./opencode-github-switcher
        run: npm install

      - name: Build and Upload Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./opencode-github-switcher
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## What's New
            
            ### ✨ Copilot Premium Request Quota Display
            - View premium request usage percentage for each account with a visual progress bar
            - Color-coded indicator: 🔵 normal (<50%) → 🟠 warning (50-80%) → 🔴 critical (>80%)
            - Shows remaining/total requests count and quota reset date
            - Supports unlimited quota display
            - Plan type badge per account (Pro, Free, Business, Enterprise, Individual)
            - Full i18n support (English, 简体中文, 日本語)
            
            ### 🐛 Bug Fixes
            - Fixed: deleting an account now correctly removes it from OpenCode's auth.json (previously only removed from local database)
          releaseDraft: false
          prerelease: false
